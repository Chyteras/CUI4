<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>CUI4 Desktop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
 * [CSS-ROOT] 字体 / Reset / 主题变量
 * 独立于父页面加载，桌面配色保持深色风格
 * ============================================================ */
@font-face{
  font-family:'TFont';
  src:url('./TFont.ttf') format('truetype');
  font-weight:normal;font-style:normal;font-display:swap;
  unicode-range:U+0021-0022,U+0027,U+002A-002D,U+002F-003B,U+003D,
    U+0041-005A,U+005B,U+005D,U+0061-007A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --text-primary:#1e2a3e;
  --text-secondary:#2c3e50;
  --accent:#3a5c8c;
  --accent-grey:#4b5e77;
  --card-glass:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.6);
  --desktop-bg:#0a0e18;
  --taskbar-bg:rgba(20,26,40,.82);
  --taskbar-border:rgba(255,255,255,.08);
  --win-bg:rgba(28,34,50,.92);
  --win-border:rgba(255,255,255,.1);
  --win-header:rgba(40,48,68,.95);
  --tray-text:#e8eefc;
  --icon-color:#cdddf7;
}
body.dark{
  --text-primary:#edf2fb;
  --text-secondary:#b9c7d9;
  --accent:#6e9eff;
  --accent-grey:#9aaec9;
  --card-glass:rgba(30,34,46,.6);
  --glass-border:rgba(74,111,165,.25);
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--desktop-bg);color:var(--text-primary);
  font-family:'TFont','Segoe UI','Inter','Microsoft YaHei',sans-serif;
  touch-action:pan-x pan-y;
}

/* ============================================================
 * [CSS-WALLPAPER] 桌面壁纸层
 * ============================================================ */
#desktopRoot{position:fixed;inset:0;overflow:hidden}
.wallpaper{position:absolute;inset:0;z-index:0;overflow:hidden}
.wp-default{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#0a0e18,#121826);
}
.wp-image{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  display:none;
}
.wp-video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:none;
}

/* ============================================================
 * [CSS-ICONS] 桌面图标
 * ============================================================ */
.desktop-icons{
  position:absolute;inset:0 0 52px 0;z-index:1;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  grid-auto-rows:104px;
  gap:8px;
  align-content:start;
  overflow-y:auto;overflow-x:hidden;
}
body.taskbar-top .desktop-icons{inset:52px 0 0 0}
.desktop-icon{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:8px;border-radius:10px;cursor:pointer;
  transition:background .15s;
  border:2px solid transparent;
  position:relative;
}
.desktop-icon:hover{background:rgba(255,255,255,.08)}
.desktop-icon.selected{
  background:rgba(110,158,255,.25);
  border-color:rgba(110,158,255,.6);
}
.desktop-icon .di-thumb{
  width:56px;height:56px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:rgba(255,255,255,.08);
}
.desktop-icon .di-thumb img{width:100%;height:100%;object-fit:cover}
.desktop-icon .di-thumb video{width:100%;height:100%;object-fit:cover}
.desktop-icon .di-thumb i{font-size:28px;color:#cdddf7}
.desktop-icon .di-name{
  font-size:.72rem;color:#e8eefc;text-align:center;
  max-width:88px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}

/* ============================================================
 * [CSS-TASKBAR] 任务栏
 * ============================================================ */
.taskbar{
  position:absolute;left:0;right:0;bottom:0;height:52px;z-index:100;
  background:var(--taskbar-bg);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--taskbar-border);
  display:flex;align-items:center;
  padding:0 6px;gap:2px;
}
body.taskbar-top .taskbar{
  top:0;bottom:auto;
  border-top:none;
  border-bottom:1px solid var(--taskbar-border);
}
.tb-start,.tb-btn{
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:6px;
  color:var(--tray-text);font-size:16px;
  transition:background .15s;flex-shrink:0;
}
.tb-start:hover,.tb-btn:hover{background:rgba(255,255,255,.08)}
.tb-start-circle{
  width:18px;height:18px;
  border:2px solid #fff;border-radius:50%;
}
.tb-apps{
  flex:1;display:flex;align-items:center;gap:2px;
  overflow-x:auto;padding:0 4px;
}
.tb-apps::-webkit-scrollbar{height:0}
.tb-app{
  width:40px;height:40px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
  transition:background .15s;overflow:hidden;
  flex-shrink:0;color:var(--tray-text);font-size:18px;
}
.tb-app:hover{background:rgba(255,255,255,.1)}
.tb-app.active{background:rgba(110,158,255,.2)}
.tb-app.active::after{
  content:'';position:absolute;bottom:2px;left:50%;
  transform:translateX(-50%);
  width:16px;height:2px;
  background:var(--accent);border-radius:2px;
}
.tb-app img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.tb-tray{
  display:flex;align-items:center;gap:4px;
  padding:0 6px;flex-shrink:0;
}
.tb-tray-item{
  height:40px;display:flex;align-items:center;justify-content:center;
  padding:0 8px;border-radius:6px;cursor:pointer;
  color:var(--tray-text);font-size:13px;
  transition:background .15s;gap:6px;flex-shrink:0;
}
.tb-tray-item:hover{background:rgba(255,255,255,.1)}
.tb-tray-time{
  flex-direction:column;line-height:1.2;
  font-family:'TFont','JetBrains Mono',monospace;
  text-align:right;font-size:11px;
}
.tb-tray-time .t-time{font-size:13px;font-weight:500}
.tb-tray-time .t-date{font-size:10px;opacity:.7}

/* ============================================================
 * [CSS-STARTMENU] 开始菜单
 * ============================================================ */
.start-menu{
  position:absolute;left:6px;bottom:58px;
  width:340px;max-height:520px;
  background:var(--win-bg);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--win-border);
  border-radius:12px;z-index:200;
  display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  animation:menuIn .2s cubic-bezier(.23,1,.32,1);
}
body.taskbar-top .start-menu{bottom:auto;top:58px}
.start-menu.show{display:flex}
@keyframes menuIn{
  from{opacity:0;transform:scale(.95) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.start-search{
  margin:12px;padding:8px 12px;
  background:rgba(255,255,255,.08);border-radius:8px;
  display:flex;align-items:center;gap:8px;
  color:#cdddf7;font-size:13px;cursor:pointer;
  transition:background .15s;
}
.start-search:hover{background:rgba(255,255,255,.12)}
.start-recent{flex:1;overflow-y:auto;padding:8px 12px}
.start-recent-title{
  font-size:11px;color:#9aaec9;
  padding:4px 8px;text-transform:uppercase;
  letter-spacing:1px;
}
.start-item{
  display:flex;align-items:center;gap:10px;
  padding:8px;border-radius:6px;cursor:pointer;
  color:var(--tray-text);font-size:13px;
  transition:background .15s;
}
.start-item:hover{background:rgba(255,255,255,.08)}
.start-item i{width:24px;text-align:center;font-size:16px;color:var(--accent)}
.start-footer{
  border-top:1px solid var(--win-border);
  padding:8px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.start-user{
  display:flex;align-items:center;gap:8px;
  color:var(--tray-text);font-size:13px;
}
.start-user i{font-size:20px}
.start-power{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tray-text);font-size:16px;
  transition:background .15s;
}
.start-power:hover{background:rgba(255,255,255,.1)}
.power-menu{
  position:absolute;bottom:56px;left:12px;
  background:var(--win-bg);
  border:1px solid var(--win-border);
  border-radius:8px;padding:6px;
  display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
  z-index:210;min-width:160px;
}
body.taskbar-top .power-menu{bottom:auto;top:56px}
.power-menu.show{display:block}
.power-item{
  padding:8px 12px;border-radius:6px;cursor:pointer;
  color:var(--tray-text);font-size:13px;
  display:flex;align-items:center;gap:10px;
  transition:background .15s;
}
.power-item:hover{background:rgba(255,255,255,.1)}

/* ============================================================
 * [CSS-WINDOWS] 窗口
 * ============================================================ */
.windows-container{
  position:absolute;inset:0 0 52px 0;z-index:50;
  pointer-events:none;
}
body.taskbar-top .windows-container{inset:52px 0 0 0}
.window{
  position:absolute;
  background:var(--win-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--win-border);
  border-radius:10px;
  display:flex;flex-direction:column;
  pointer-events:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  overflow:hidden;min-width:280px;min-height:180px;
}
.window.active{box-shadow:0 16px 50px rgba(0,0,0,.6)}
.win-header{
  height:38px;background:var(--win-header);
  display:flex;align-items:center;
  padding:0 8px;cursor:move;flex-shrink:0;
  gap:8px;user-select:none;
}
.win-title{
  flex:1;font-size:12px;color:var(--tray-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.win-ctrls{display:flex;gap:2px}
.win-ctrl{
  width:32px;height:28px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tray-text);font-size:11px;
  transition:background .15s;
}
.win-ctrl:hover{background:rgba(255,255,255,.1)}
.win-ctrl.win-close:hover{background:#e81123}
.win-body{
  flex:1;overflow:auto;padding:12px;
  color:var(--tray-text);font-size:13px;
}
body.win-dragging iframe,
body.win-dragging video{pointer-events:none}

/* ============================================================
 * [CSS-DESKTOPSEARCH] 桌面搜索
 * ============================================================ */
.desktop-search{
  position:absolute;left:50%;top:15%;
  transform:translateX(-50%);
  width:min(600px,90vw);
  background:var(--win-bg);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--win-border);
  border-radius:12px;z-index:250;
  display:none;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  overflow:hidden;
}
.desktop-search.show{display:flex}
.ds-input-row{
  display:flex;align-items:center;
  padding:12px 16px;gap:10px;
  border-bottom:1px solid var(--win-border);
}
.ds-input-row i{color:var(--accent);font-size:16px}
.ds-input-row input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--tray-text);font-size:15px;font-family:inherit;
}
.ds-results{max-height:400px;overflow-y:auto;padding:8px}
.ds-result{
  padding:10px 12px;border-radius:6px;cursor:pointer;
  color:var(--tray-text);font-size:13px;
  display:flex;align-items:center;gap:10px;
  transition:background .15s;
}
.ds-result:hover{background:rgba(255,255,255,.08)}
.ds-result i{width:20px;text-align:center;color:var(--accent)}

/* ============================================================
 * [CSS-SETTINGS] 桌面设置弹窗
 * ============================================================ */
.desktop-settings{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(600px,90vw);max-height:80vh;
  background:var(--win-bg);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--win-border);
  border-radius:12px;z-index:260;
  display:none;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  overflow:hidden;
}
.desktop-settings.show{display:flex}
.ds-header{
  padding:14px 18px;
  border-bottom:1px solid var(--win-border);
  display:flex;align-items:center;justify-content:space-between;
  color:var(--tray-text);font-size:15px;font-weight:500;
}
.ds-body{
  padding:16px 18px;overflow-y:auto;
  color:var(--tray-text);font-size:13px;
}
.ds-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--win-border);
  gap:12px;
}
.ds-row:last-child{border-bottom:none}
.ds-row .label{font-size:13px}
.ds-row .desc{font-size:11px;opacity:.6;margin-top:2px}
.toggle-switch{
  width:44px;height:22px;background:#555;border-radius:30px;
  cursor:pointer;transition:.2s;position:relative;flex-shrink:0;
}
.toggle-switch.active{background:var(--accent)}
.toggle-switch::after{
  content:'';width:18px;height:18px;background:#fff;
  border-radius:50%;position:absolute;top:2px;left:2px;
  transition:.2s;
}
.toggle-switch.active::after{left:24px}
.theme-btns{display:flex;gap:6px}
.theme-btn{
  padding:4px 12px;border-radius:30px;cursor:pointer;
  background:rgba(128,128,128,.2);transition:all .2s;
  font-size:12px;color:var(--tray-text);
}
.theme-btn.active{background:var(--accent);color:#fff}
.btn{
  padding:6px 14px;border-radius:6px;
  background:var(--accent);color:#fff;
  border:none;cursor:pointer;font-size:12px;
  font-family:inherit;transition:filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn.secondary{background:rgba(128,128,128,.3)}
.btn.danger{background:#e74c3c}
.file-label{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 14px;border-radius:6px;
  background:var(--accent);color:#fff;
  cursor:pointer;font-size:12px;
  transition:filter .15s;
}
.file-label:hover{filter:brightness(1.1)}

/* ============================================================
 * [CSS-VOLUME] 音量面板
 * ============================================================ */
.volume-panel{
  position:absolute;right:6px;bottom:58px;
  width:320px;background:var(--win-bg);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--win-border);
  border-radius:12px;z-index:220;
  display:none;padding:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  color:var(--tray-text);
}
body.taskbar-top .volume-panel{bottom:auto;top:58px}
.volume-panel.show{display:block}
.vp-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;
}
.vp-mute{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:20px;color:var(--tray-text);
  transition:background .15s;flex-shrink:0;
}
.vp-mute:hover{background:rgba(255,255,255,.1)}
.vp-mute.muted{color:#ff6b6b}
.vp-slider-row{display:flex;align-items:center;gap:10px;flex:1}
.vp-slider-row input[type="range"]{flex:1}
.vp-pct{
  font-size:13px;min-width:44px;text-align:right;
  font-family:'TFont',monospace;
}

/* ============================================================
 * [CSS-CONTEXTMENU] 右键菜单
 * ============================================================ */
.context-menu{
  position:absolute;background:var(--win-bg);
  border:1px solid var(--win-border);
  border-radius:8px;padding:6px;
  z-index:300;min-width:180px;
  display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);
  color:var(--tray-text);
}
.context-menu.show{display:block}
.ctx-item{
  padding:8px 12px;border-radius:4px;cursor:pointer;
  font-size:12px;display:flex;align-items:center;gap:8px;
  transition:background .15s;
}
.ctx-item:hover{background:rgba(255,255,255,.1)}
.ctx-item i{width:16px;text-align:center;font-size:12px}

/* ============================================================
 * [CSS-MULTITASK] 多任务视图
 * ============================================================ */
.multitask-overlay{
  position:absolute;inset:0;z-index:270;
  background:rgba(10,14,24,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:none;flex-direction:column;padding:40px;
}
.multitask-overlay.show{display:flex}
.mt-title{
  color:var(--tray-text);font-size:22px;
  font-weight:500;margin-bottom:24px;text-align:center;
}
.mt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;flex:1;overflow-y:auto;align-content:start;
}
.mt-card{
  background:var(--win-bg);
  border:1px solid var(--win-border);
  border-radius:10px;padding:20px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--tray-text);
  transition:transform .15s,background .15s;min-height:160px;
}
.mt-card:hover{transform:scale(1.03);background:rgba(110,158,255,.15)}
.mt-card i{font-size:36px;color:var(--accent)}
.mt-card span{font-size:13px}
.mt-empty{
  grid-column:1/-1;text-align:center;
  color:#9aaec9;padding:60px 20px;font-size:14px;
}

/* ============================================================
 * [CSS-NOTEPAD] 记事本
 * ============================================================ */
.np-toolbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.08);
  flex-shrink:0;background:rgba(255,255,255,.03);
}
.np-textarea{
  flex:1;width:100%;resize:none;border:none;outline:none;
  background:transparent;color:var(--tray-text);
  font-family:'TFont','Consolas',monospace;
  font-size:13px;line-height:1.6;padding:12px 14px;
}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--accent-grey);border-radius:10px}

@media(max-width:640px){
  .start-menu{width:calc(100vw - 12px);max-height:60vh}
  .desktop-icons{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .window{min-width:240px;min-height:160px}
  .volume-panel{width:calc(100vw - 12px);max-width:320px}
}
</style>
</head>
<body>

<!-- ============================================================
     [HTML-ROOT] 桌面根容器
     ============================================================ -->
<div id="desktopRoot">

  <!-- 壁纸层 -->
  <div class="wallpaper">
    <div class="wp-default" id="wpDefault"></div>
    <div class="wp-image" id="wpImage"></div>
    <video class="wp-video" id="wpVideo" muted autoplay loop playsinline></video>
  </div>

  <!-- 桌面图标 -->
  <div class="desktop-icons" id="desktopIcons"></div>

  <!-- 窗口容器 -->
  <div class="windows-container" id="windowsContainer"></div>

  <!-- 任务栏 -->
  <div class="taskbar" id="taskbar">
    <div class="tb-start" id="tbStart" title="开始 (↑)">
      <div class="tb-start-circle"></div>
    </div>
    <div class="tb-btn" id="tbSearch" title="搜索 (←)">
      <i class="fas fa-search"></i>
    </div>
    <div class="tb-btn" id="tbMultitask" title="多任务 (CapsLock)">
      <i class="fas fa-th-large"></i>
    </div>
    <div class="tb-apps" id="tbApps"></div>
    <div class="tb-tray">
      <div class="tb-tray-item" id="trayBattery" style="display:none">
        <i class="fas fa-battery-half"></i>
        <span id="trayBatteryText">--%</span>
      </div>
      <div class="tb-tray-item" id="trayVolume" title="音量">
        <i class="fas fa-volume-up" id="trayVolumeIcon"></i>
      </div>
      <div class="tb-tray-item tb-tray-time" id="trayTime">
        <div class="t-time" id="trayTimeText">--:--:--</div>
        <div class="t-date" id="trayDateText">----.--.--</div>
      </div>
      <div class="tb-tray-item" id="trayExit" title="返回主界面 (→ / Esc)">
        <i class="fas fa-sign-out-alt"></i>
      </div>
    </div>
  </div>

  <!-- 开始菜单 -->
  <div class="start-menu" id="startMenu">
    <div class="start-search" id="startSearchBtn">
      <i class="fas fa-search"></i><span>搜索应用、设置、文件</span>
    </div>
    <div class="start-recent">
      <div class="start-recent-title">最近打开</div>
      <div id="startRecentList"></div>
    </div>
    <div class="start-footer">
      <div class="start-user">
        <i class="fas fa-user-circle"></i>
